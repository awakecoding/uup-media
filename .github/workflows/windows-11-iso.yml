name: Windows 11 ISO
on: workflow_dispatch
jobs:
  build:
    name: Windows 11 ISO
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 26H1, 25H2, 24H2, 23H2 ]
        os_arch: [ x64, arm64 ]

        include:
        - os_version: 26H1
          os_build: latest
        - os_version: 25H2
          os_build: latest
        - os_version: 24H2
          os_build: latest
        - os_version: 23H2
          os_build: latest

    steps:
      - name: Check out ${{ github.repository }}
        uses: actions/checkout@v6

      - name: Select Windows OS build
        shell: pwsh
        run: |
          $OSVersion = '${{matrix.os_version}}'
          $ChangeHistoryName = "Windows 11, version $OSVersion"
          $UpdateJsonPath = Join-Path $Env:RUNNER_TEMP "windows-11-$OSVersion-update.json"
          .\scripts\Get-WindowsUpdateHistory.ps1 -Name $ChangeHistoryName -Build '${{matrix.os_build}}' -OutputPath $UpdateJsonPath | Out-Null
          $WindowsUpdate = Get-Content $UpdateJsonPath -Raw | ConvertFrom-Json
          $OSBuild = $WindowsUpdate.Build
          echo "OS_BUILD=$OSBuild" >> $Env:GITHUB_ENV

          echo "::notice::Name: $ChangeHistoryName"
          echo "::notice::Metadata: $UpdateJsonPath"
          echo "::notice::Title: $($WindowsUpdate.Title)"
          echo "::notice::Build: $($WindowsUpdate.Build)"
          echo "::notice::KB: $($WindowsUpdate.KB)"
          echo "::notice::Link: $($WindowsUpdate.Link)"

      - name: Configure runner
        run: |
          docker system prune -a -f
          New-Item "C:\workspace" -ItemType Directory

      - name: Download UUP Media Creator
        shell: pwsh
        run: |
          $DownloadUrl = "https://github.com/gus33000/UUPMediaCreator/releases/download/v3.1.9.3/win-x64-binaries.zip"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest $DownloadUrl -OutFile .\UUPMediaCreator.zip
          Expand-Archive -Path .\UUPMediaCreator.zip C:\UUPMediaCreator
          echo "PATH=$Env:PATH;C:\UUPMediaCreator" >> $Env:GITHUB_ENV

      - name: Download UUP files
        shell: pwsh
        working-directory: C:\workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $OSArch = '${{matrix.os_arch}}'
          $OSBuild = $Env:OS_BUILD
          $MachineType = @{'x64'='amd64';'arm64'='arm64'}[$OSArch]
          $ReportingVersion = "10.0.${OSBuild}"
          UUPDownload.exe -s Professional -r Retail -b Retail -c vb_release -l en-US -t $MachineType -v $ReportingVersion

          if ($LASTEXITCODE -ne 0) {
            throw "UUPDownload.exe failed with exit code $LASTEXITCODE for build $OSBuild and architecture $OSArch."
          }

          $UupPath = Get-Item .\10.0.*.*.* -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $UupPath) {
            throw "UUPDownload.exe did not produce a UUP workspace directory for build $OSBuild and architecture $OSArch."
          }

      - name: Create Windows ISO
        shell: pwsh
        working-directory: C:\workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $OSArch = '${{matrix.os_arch}}'
          $OSVersion = '${{matrix.os_version}}'
          $UupPath = Get-Item .\10.0.*.*.* -ErrorAction Stop | Select-Object -First 1 -ExpandProperty Name
          $IsoPath = "C:\workspace\Windows_11_${OSVersion}_${OSArch}.iso"
          UUPMediaConverter.exe -l en-US --uup-path .\$UupPath --iso-path $IsoPath

          if ($LASTEXITCODE -ne 0) {
            throw "UUPMediaConverter.exe failed with exit code $LASTEXITCODE for version $OSVersion and architecture $OSArch."
          }

          if (-not (Test-Path -Path $IsoPath)) {
            throw "UUPMediaConverter.exe completed without producing $IsoPath. The selected build or architecture is not convertible for this SKU/language combination."
          }

      - name: Upload Windows ISO
        uses: actions/upload-artifact@v7
        with:
          name: Windows-11-${{matrix.os_version}}-${{matrix.os_arch}}-iso
          path: C:\workspace\Windows_11_${{matrix.os_version}}_${{matrix.os_arch}}.iso
          if-no-files-found: error
